name: joldinaw
x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/backend.Dockerfile
  env_file: .env
  volumes:
    - cvfiles:/app/storage
    - modelcache:/app/artifacts
  networks: [internal]
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-joldinaw}
      POSTGRES_USER: ${POSTGRES_USER:-joldinaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [rq, worker, screening, --url, 'redis://redis:6379/0']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  mcp:
    <<: *backend
    command: [uvicorn, 'mcp_server.server:app', --host, '0.0.0.0', --port, '8001']
    ports: ['127.0.0.1:8001:8001']
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports: ['127.0.0.1:5173:8080']
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
  trainer:
    build:
      context: .
      dockerfile: infra/docker/trainer.Dockerfile
    profiles: [ml]
    working_dir: /app
    command: [python, -m, ml.pipeline, --help]
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./ml/reports:/app/ml/reports
    networks: [internal]
volumes:
  pgdata:
  redisdata:
  cvfiles:
  modelcache:
networks:
  internal:
