name: joldinaw-production
x-backend: &backend
  image: ${BACKEND_IMAGE:?Set immutable backend digest reference}
  env_file: .env.production
  restart: unless-stopped
  volumes: [cvfiles:/app/storage, modelcache:/app/artifacts]
  networks: [internal]
  security_opt: [no-new-privileges:true]
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    restart: 'no'
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    networks: [internal, public]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *backend
    command: [rq, worker, screening, --url, 'redis://redis:6379/0']
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 2g
    cpus: 2
  mcp:
    <<: *backend
    networks: [internal, public]
    profiles: [mcp]
    command: [uvicorn, 'mcp_server.server:app', --host, '0.0.0.0', --port, '8001']
    depends_on:
      api: {condition: service_healthy}
  frontend:
    image: ${FRONTEND_IMAGE:?Set immutable frontend digest reference}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      api: {condition: service_healthy}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set production domain}
    volumes: [./infra/Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data, caddyconfig:/config]
    networks: [internal, public]
    depends_on: [frontend, api]
volumes:
  pgdata:
  redisdata:
  cvfiles:
  modelcache:
  caddydata:
  caddyconfig:
networks:
  internal:
    internal: true
  public:
