name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_DB: testdb, POSTGRES_USER: testuser, POSTGRES_PASSWORD: ci-only-password}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U testuser -d testdb" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://testuser:ci-only-password@localhost:5432/testdb
      TEST_DATABASE_URL: postgresql+psycopg://testuser:ci-only-password@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-key-with-at-least-32-characters
      DEMO_PASSWORD: ci-demo
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - run: pip install -r requirements.lock
      - run: alembic upgrade head
      - run: ruff check . ../ml
      - run: pytest -q
      - run: python scripts/verify_infrastructure.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cp .env.ci .env
      - run: docker compose --env-file .env.ci config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: curl --fail http://localhost:8000/ready && curl --fail http://localhost:5173/health
      - if: always()
        run: docker compose logs --tail=100

